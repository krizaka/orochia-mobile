# The CI of Orochia mobile: the org's reusable Expo pipeline (krizaka/.github expo-ci.yml, #113), with this repository's own
# triggers and concurrency. Lint, typecheck, tests and the bundle export run side by side; the release workflow keeps its own jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/expo-ci.yml@98a0517a83118348aacca8aa4d1c90e15d7a4163 # v1.3.1
    with:
      extra-scripts: |
        check:app-links
        export

  # The required check keeps its name (branch protection); it reads the gate's verdict. Once protection requires
  # « ci / CI gate », this shim goes.
  check:
    name: Lint, types, tests, iOS and Android bundles
    needs: ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      RESULT: ${{ needs.ci.outputs.result }}
    steps:
      - run: test "$RESULT" = success
