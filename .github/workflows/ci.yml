# The CI of Orochia mobile: the org's reusable Expo pipeline (krizaka/.github expo-ci.yml, #113), with this repository's own
# triggers and concurrency. Lint, typecheck, tests and the bundle export run side by side; the release workflow keeps its own jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/expo-ci.yml@babcdf0d85b0ef2ce30802ec8377d664d31fd118 # v1.3.3
    with:
      extra-scripts: |
        check:app-links
        export
