name: Release

# A v* tag builds an Android preview APK and attaches it to the GitHub release. The APK is signed with the debug key
# generated by the build (installable directly, not for a store); iOS goes through EAS with the Apple account.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "const f='app.json',j=require('./'+f);j.expo.version='$version';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
      - run: npx expo prebuild --platform android --no-install
      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "orochia-${GITHUB_REF_NAME}.apk"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Orochia $GITHUB_REF_NAME" --notes "Android preview build — install on a device (allow apps from this source). iOS: TestFlight / ad hoc through EAS."
          gh release upload "$GITHUB_REF_NAME" "orochia-${GITHUB_REF_NAME}.apk" --clobber
